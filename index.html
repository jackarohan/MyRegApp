  document.getElementById("root").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#f59e0b;text-align:center"><div><h2>Failed to load data</h2><p style="color:#999">One or more data files could not be loaded.</p><button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#f59e0b;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600">Reload</button></div></div>';

<script type="text/babel">
if(typeof R==="undefined"||typeof G==="undefined"||typeof WC==="undefined"||typeof B3E==="undefined") throw new Error("Data files not loaded");
const {useState,useMemo,useEffect,useRef,useCallback}=React;

/*═══════════════ PERSISTENCE ═══════════════*/

function ls(k,fallback){try{const v=localStorage.getItem("mra_"+k);return v!==null?JSON.parse(v):fallback}catch{return fallback}}
function lsSet(k,v){try{localStorage.setItem("mra_"+k,JSON.stringify(v))}catch{}}

function usePersistedState(key,init){
  const[val,setVal]=useState(()=>ls(key,init));
  const set=useCallback(v=>{
    setVal(prev=>{const nv=typeof v==="function"?v(prev):v;lsSet(key,nv);return nv});
  },[key]);
  return[val,set];
}


function useTheme(){
  const prefersDark=typeof window!=="undefined"&&window.matchMedia("(prefers-color-scheme:dark)").matches;
  const[theme,setTheme]=usePersistedState("theme",prefersDark?"dark":"light");
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",theme==="dark"?"#0a0a0e":"#f5f5f0")},[theme]);
  const toggle=()=>setTheme(t=>t==="dark"?"light":"dark");
  return{theme,toggle};
}

function useFontSize(){
  const[sz,setSz]=usePersistedState("fontsize","md");
  const map={sm:"12.5px",md:"13.5px",lg:"15px"};
  useEffect(()=>{document.documentElement.style.setProperty("--font-size",map[sz]||map.md)},[sz]);
  return{sz,setSz,sizes:["sm","md","lg"],labels:["A\u207B","A","A\u207A"]};
}


/* Debounced value hook for search */
function useDebounce(value,delay){
  const[deb,setDeb]=useState(value);
  useEffect(()=>{const t=setTimeout(()=>setDeb(value),delay);return()=>clearTimeout(t)},[value,delay]);
  return deb;
}

/* Extract context snippet around a search match (~120 chars) */
function searchSnippet(reg,q){
  if(!q||!q.trim())return null;
  const lq=q.toLowerCase();
  for(const s of reg.subs){
    for(const c of s.c){
      const idx=c.toLowerCase().indexOf(lq);
      if(idx!==-1){
        const start=Math.max(0,idx-50);
        const end=Math.min(c.length,idx+q.length+70);
        let snip=(start>0?"…":"")+c.slice(start,end)+(end<c.length?"…":"");
        return{snip:stripRefs(snip),sub:s.t};
      }
    }
  }
  return null;
}

/* Toast notification system */
let _toastEl=null;let _toastTimer=null;
function showToast(msg){
  if(!_toastEl){_toastEl=document.createElement("div");_toastEl.className="toast";_toastEl.setAttribute("role","status");_toastEl.setAttribute("aria-live","polite");document.body.appendChild(_toastEl)}
  _toastEl.textContent=msg;_toastEl.classList.add("show");
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>_toastEl.classList.remove("show"),1800);
}

/* Copy current subsection URL to clipboard */
function copySubLink(regId,subIdx){
  const url=window.location.origin+window.location.pathname+"#/regulations/"+regId+"/"+subIdx;
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>showToast("Link copied")).catch(()=>showToast("Copy failed"))}
  else{const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("Link copied")}
}

/* Print current regulation — renders all subsections for a complete printout */
function safeURL(u){try{const url=new URL(u);return["http:","https:"].includes(url.protocol)?url.href:"#"}catch{return"#"}}
function printRegulation(reg){
  const w=window.open("","_blank","width=800,height=900");
  if(!w)return showToast("Pop-up blocked");
  const subs=reg.subs.map((s,i)=>{
    const content=s.c.map(p=>"<p>"+p.replace(/\{\{ref:[^}]+\}\}/g,"").replace(/\{\{gl:[^}]+\}\}/g,m=>m.replace("{{gl:","").replace("}}",""))+"</p>").join("");
    const kps=s.kp&&s.kp.length?"<div class='kp-box'><h4>Key Points</h4><ul>"+s.kp.map(k=>"<li>"+k+"</li>").join("")+"</ul></div>":"";
    const srcs=s.src&&s.src.length?"<div class='src-box'><h4>Source Documents</h4>"+s.src.map(d=>"<div class='src-item'><strong>"+d.t+"</strong> <span>("+d.d+")</span>"+(d.u?" &mdash; <a href='"+safeURL(d.u)+"'>"+d.u+"</a>":"")+"</div>").join("")+"</div>":"";
    const cites=s.cite&&s.cite.length?"<div class='cite-box'><h4>Regulatory Authority</h4>"+s.cite.map(c=>"<div class='cite-item'>"+c.pin+"</div>").join("")+"</div>":"";
    const tbls=s.tables&&s.tables.length?s.tables.map(t=>{
      const hdr=t.headers?"<thead><tr>"+t.headers.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead>":"";
      const body="<tbody>"+t.rows.map(r=>r.length===1?"<tr><td colspan='"+(t.headers?t.headers.length:1)+"' class='tbl-group'>"+r[0]+"</td></tr>":"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody>";
      const fn=t.footnote?"<div class='tbl-fn'>"+t.footnote+"</div>":"";
      return"<div class='tbl-wrap'>"+(t.title?"<div class='tbl-title'>"+t.title+"</div>":"")+"<table>"+hdr+body+"</table>"+fn+"</div>";
    }).join(""):"";
    return"<div class='section'><h2>"+s.t+"</h2>"+content+kps+tbls+srcs+cites+"</div>";
  }).join("");
  w.document.write("<!DOCTYPE html><html><head><title>"+reg.title+" — MyRegApp</title><style>"+
    "body{font-family:Georgia,serif;max-width:680px;margin:40px auto;color:#1a1a1a;font-size:11pt;line-height:1.65}"+
    "h1{font-family:system-ui,sans-serif;font-size:18pt;margin-bottom:4pt}"+
    ".subtitle{color:#666;font-size:10pt;margin-bottom:24pt;border-bottom:1px solid #ccc;padding-bottom:12pt}"+
    "h2{font-family:system-ui,sans-serif;font-size:13pt;margin:20pt 0 8pt;color:#333;border-bottom:1px solid #eee;padding-bottom:4pt}"+
    "p{margin-bottom:8pt}"+

function useHashRoute(){
  const parse=()=>{
    const raw=window.location.hash.replace(/^#\/?/,"");
    const[pathPart,queryPart]=raw.split("?");
    const[view,regId,subStr]=pathPart.split("/");
    const params=new URLSearchParams(queryPart||"");
    return{view:view||"regulations",regId:regId||null,subIdx:subStr!=null?parseInt(subStr,10):null,q:params.get("q")||""};
  };
  const[route,setRoute]=useState(parse);
  useEffect(()=>{
    const handler=()=>setRoute(parse());
    window.addEventListener("hashchange",handler);
    return()=>window.removeEventListener("hashchange",handler);
  },[]);
  const push=(view,regId,subIdx,query)=>{
    let h="#/"+view;
    if(regId)h+="/"+regId;
    if(subIdx!=null)h+="/"+subIdx;
    if(query)h+="?q="+encodeURIComponent(query);
    window.location.hash=h;
  };
  return{route,push};
}

// Search relevance scoring: title > summary > key points > content
function searchScore(reg,q){
  if(!q)return 0;
  const lq=q.toLowerCase();
  let score=0;
  if(reg.title.toLowerCase().includes(lq))score+=100;
  if(reg.st.toLowerCase().includes(lq))score+=80;
  if(reg.sum.toLowerCase().includes(lq))score+=50;
  reg.subs.forEach(s=>{
    if(s.kp&&s.kp.some(k=>k.toLowerCase().includes(lq)))score+=30;
    if(s.c.some(c=>c.toLowerCase().includes(lq)))score+=10;
  });
  return score;
}

// Search: find which subsection indices match for a given regulation
function matchedSubs(reg,q){
  if(!q)return[];
  const lq=q.toLowerCase();
  const hits=[];
  reg.subs.forEach((s,i)=>{
    if(s.t.toLowerCase().includes(lq)||s.c.some(c=>c.toLowerCase().includes(lq))||(s.kp&&s.kp.some(k=>k.toLowerCase().includes(lq)))||(s.tables&&s.tables.some(t=>(t.title&&t.title.toLowerCase().includes(lq))||t.rows.some(r=>r.some(c=>c.toLowerCase().includes(lq))))))hits.push(i);
  });
  return hits;
}

// Highlight search term in plain text (returns array of strings/spans)
function highlightText(text,q){
  if(!q||!q.trim())return[text];
  const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp("("+esc+")","gi");
  const parts=text.split(re);
  return parts.map((p,i)=>i%2===1?<mark key={i} className="sh">{p}</mark>:p);
}

/* Strip {{ref:...}} tags from raw text for display contexts without SmartText */
function stripRefs(text){return text.replace(/\{\{ref:[a-z0-9-]+\}\}/g,"").replace(/\{\{gl:[^}]+\}\}/g,m=>m.slice(5,-2))}

// Build glossary regex — match longest terms first
const GT=Object.keys(G).sort((a,b)=>b.length-a.length);
const GRE=new RegExp("\\b("+GT.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join("|")+")\\b","g");
const REF=/\{\{ref:([a-z0-9-]+)\}\}/g;

// Build map of pending WC entries per regulation
const WC_BY_REG={};
WC.forEach(w=>{if(w.reg){if(!WC_BY_REG[w.reg])WC_BY_REG[w.reg]=[];WC_BY_REG[w.reg].push(w)}});

// Build reverse cross-reference index (backlinks)
const BACKLINKS={};
R.forEach(reg=>{
  const re=/\{\{ref:([a-z0-9-]+)\}\}/g;
  reg.subs.forEach(sub=>{sub.c.forEach(p=>{let m;while((m=re.exec(p))!==null){const target=m[1];if(target!==reg.id){if(!BACKLINKS[target])BACKLINKS[target]=new Set();BACKLINKS[target].add(reg.id)}}})});
});
Object.keys(BACKLINKS).forEach(k=>{BACKLINKS[k]=[...BACKLINKS[k]]});

// Build glossary term usage map (term → regulations that use it)
const TERM_USAGE={};
R.forEach(reg=>{
  const allText=reg.subs.map(s=>s.c.join(" ")).join(" ").toLowerCase();
  GT.forEach(term=>{if(allText.includes(term.toLowerCase())){if(!TERM_USAGE[term])TERM_USAGE[term]=[];TERM_USAGE[term].push({id:reg.id,st:reg.st})}});
});

/* Portal tooltip that positions itself relative to the viewport */
function GlossaryTooltip({term,anchorEl,onClose}){
  const tipRef=useRef(null);
  const[pos,setPos]=useState(null);

  useEffect(()=>{
    if(!anchorEl)return;
    const compute=()=>{
      const r=anchorEl.getBoundingClientRect();
      const tw=280;const th=tipRef.current?tipRef.current.offsetHeight:80;const gap=8;
      /* Vertical: prefer above, flip below if not enough room */
      const above=r.top-gap-th>8;
      const top=above?r.top-gap-th:r.bottom+gap;
      /* Horizontal: center on term, clamp to viewport */
      let left=r.left+r.width/2-tw/2;
      const pad=16;
      if(left<pad)left=pad;
      if(left+tw>window.innerWidth-pad)left=window.innerWidth-pad-tw;
      /* Arrow horizontal offset relative to tooltip */
      const arrowLeft=Math.max(16,Math.min(tw-16,r.left+r.width/2-left));
      setPos({top,left,above,arrowLeft});
    };
    compute();
    /* Recompute on scroll/resize since anchor moves */
    window.addEventListener("scroll",compute,true);
    window.addEventListener("resize",compute);
    return()=>{window.removeEventListener("scroll",compute,true);window.removeEventListener("resize",compute)};
  },[anchorEl]);

  useEffect(()=>{
    const dismiss=e=>{if(tipRef.current&&!tipRef.current.contains(e.target)&&e.target!==anchorEl)onClose()};
    const esc=e=>{if(e.key==="Escape")onClose()};
    document.addEventListener("mousedown",dismiss);
    document.addEventListener("touchstart",dismiss,{passive:true});
    document.addEventListener("keydown",esc);
    return()=>{document.removeEventListener("mousedown",dismiss);document.removeEventListener("touchstart",dismiss);document.removeEventListener("keydown",esc)};
  },[onClose,anchorEl]);

  const style=pos?{top:pos.top,left:pos.left}:{top:-9999,left:-9999,opacity:0};
  const arrowStyle=pos?{position:"absolute",left:pos.arrowLeft,transform:"translateX(-50%)",border:"6px solid transparent",width:0,height:0,...(pos.above?{top:"100%",borderTopColor:"var(--tooltip-bg)"}:{bottom:"100%",borderBottomColor:"var(--tooltip-bg)"})}:{display:"none"};
  return ReactDOM.createPortal(
    <div ref={tipRef} className="tooltip" role="tooltip" id={"tip-"+term} style={style} onClick={e=>e.stopPropagation()}>
      <div className="tooltip-term">{term}</div>
      <div className="tooltip-def">{G[term]}</div>
      <span style={arrowStyle}/>
    </div>,
    document.body
  );
}

function SmartText({text,onNav,search}){
  const[tip,setTip]=useState(null);
  const anchorRef=useRef(null);

  const parts=text.split(REF);
  const out=[];
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      const reg=R.find(r=>r.id===parts[i]);
      if(reg) out.push(<a key={"r"+i} className="ref-link" href={"#/regulations/"+parts[i]} onClick={e=>{e.preventDefault();e.stopPropagation();onNav&&onNav(parts[i])}}>{reg.st}</a>);
      else out.push(null);
    } else {
      if(!parts[i]){continue}
      let last=0;GRE.lastIndex=0;let m;
      while((m=GRE.exec(parts[i]))!==null){
        if(m.index>last){const seg=parts[i].slice(last,m.index);out.push(...highlightText(seg,search))}
        const term=GT.find(t=>t===m[1])||m[1];
        const uid=i+"-"+m.index;
        out.push(
          <span key={"g"+uid} style={{position:"relative",display:"inline-block"}}>
            <span className="gterm" tabIndex={0} role="button" aria-describedby={tip===uid?"tip-"+term:undefined} onClick={e=>{e.stopPropagation();anchorRef.current=e.currentTarget;setTip(tip===uid?null:uid)}} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();anchorRef.current=e.currentTarget;setTip(tip===uid?null:uid)}}}>{m[0]}</span>
            {tip===uid&&<GlossaryTooltip term={term} anchorEl={anchorRef.current} onClose={()=>setTip(null)}/>}
          </span>
        );
        last=GRE.lastIndex;
      }
      if(last<parts[i].length){const seg=parts[i].slice(last);out.push(...highlightText(seg,search))}
    }
  }
  return <span>{out}</span>;
}

function MobileDrawer({open,onClose,currentId,onSelect}){
  const panelRef=useRef(null);
  const prevFocus=useRef(null);
  const touchX=useRef(null);
  useEffect(()=>{
    if(open){prevFocus.current=document.activeElement;document.body.style.overflow="hidden";setTimeout(()=>panelRef.current?.focus(),50)}
    else{document.body.style.overflow="";if(prevFocus.current){prevFocus.current.focus();prevFocus.current=null}}
    return()=>{document.body.style.overflow=""};
  },[open]);
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(e.key==="Escape")onClose()};
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[open,onClose]);
  useEffect(()=>{
    if(!open)return;
    const panel=panelRef.current;if(!panel)return;
    const handler=e=>{
      if(e.key!=="Tab")return;
      const focusable=panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(!focusable.length)return;
      const first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    };
    window.addEventListener("keydown",handler);return()=>window.removeEventListener("keydown",handler);
  },[open]);
  let lastCat=null;
  return(<>
    <div className={"drawer-overlay"+(open?" active":"")} onClick={onClose}/>
    <div ref={panelRef} className={"drawer-panel"+(open?" active":"")} role="dialog" aria-modal="true" aria-label="Regulation navigation" tabIndex={-1}
      onTouchStart={e=>{touchX.current=e.touches[0].clientX}}
      onTouchMove={e=>{if(touchX.current!==null&&e.touches[0].clientX<touchX.current-60){onClose();touchX.current=null}}}
      onTouchEnd={()=>{touchX.current=null}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 18px 12px",borderBottom:"1px solid var(--border)"}}>
        <span style={{fontSize:"var(--text-lg)",fontWeight:800,letterSpacing:"-.3px"}}>Regulations</span>
        <button onClick={onClose} aria-label="Close navigation" style={{fontSize:18,padding:"8px 12px",minWidth:44,minHeight:44,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,color:"var(--text3)"}}>{"\u2715"}</button>
      </div>
      <div style={{padding:"8px 16px 24px"}}>
        {R.map(r=>{
          const showHdr=r.cat!==lastCat;lastCat=r.cat;
          return <React.Fragment key={r.id}>
            {showHdr&&<div style={{fontSize:"var(--text-xs)",fontWeight:700,color:"var(--text5)",textTransform:"uppercase",letterSpacing:".8px",padding:"14px 0 6px",borderTop:r===R[0]?"none":"1px solid var(--border)",marginTop:r===R[0]?0:4}}>{r.cat}</div>}
            <button onClick={()=>onSelect(r.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 12px",minHeight:44,borderRadius:8,marginBottom:2,textAlign:"left",background:r.id===currentId?"var(--amber-bg3)":"transparent",color:r.id===currentId?"var(--amber)":"var(--text2)",fontWeight:r.id===currentId?700:500,fontSize:"var(--text-md)",transition:"border-color .12s,background .12s,color .12s"}}>
              <span style={{fontSize:16,flexShrink:0}}>{r.icon}</span>
              {r.st}
            </button>
          </React.Fragment>})}
      </div>
    </div>
  </>);
}

function WaterfallChart({chart}){
  const steps=chart.steps;
  const maxAbs=Math.max(...steps.map(s=>Math.abs(s.value)));
  const decColor=cssVar("--dir-decrease");
  const incColor=cssVar("--dir-increase");
  const simpColor=cssVar("--dir-simplification");
  return(
  <div style={{marginTop:16,background:"var(--bg)",borderRadius:10,padding:"16px 18px",border:"1px solid var(--border)"}}>
    <div style={{fontSize:11,fontWeight:700,letterSpacing:.8,color:"var(--text4)",marginBottom:14,textTransform:"uppercase"}}>{chart.title}</div>
    {steps.map((s,i)=>{
      const barW=(Math.abs(s.value)/maxAbs)*100;
      const isNet=s.label.includes("Net After");
      const color=s.color?( s.color==="#4ECDC4"?decColor : s.color==="#FF6B6B"?incColor : s.color==="#60A5FA"?simpColor : s.color ) : (s.value<0?decColor:incColor);
      return(
      <div key={i} style={{marginBottom:6}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--text3)",marginBottom:2}}>
          <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:isNet?700:400}}>{s.label}</span>
          <span style={{fontWeight:700,color,fontFamily:"'DM Mono',monospace",flexShrink:0,marginLeft:8}}>{s.value>0?"+":""}{s.value}%</span>
        </div>
        <div style={{height:isNet?7:5,background:"var(--bg3)",borderRadius:3}} role="img" aria-label={s.label+": "+(s.value>0?"+":"")+s.value+"% RWA impact"}>
          <div style={{height:"100%",borderRadius:3,background:color,width:barW+"%",opacity:isNet?1:.8}}/>
        </div>
      </div>);
    })}
  </div>);
}

const TL_COLORS=["#f59e0b","#3b82f6","#10b981","#ef4444","#8b5cf6","#ec4899","#06b6d4","#f97316","#14b8a6","#a855f7","#6366f1","#84cc16","#e11d48","#0ea5e9","#d946ef","#22c55e","#facc15"];

function parseTimelineEvents(){
  const events=[];
  R.forEach((reg,ri)=>{
    const kdSub=reg.subs.find(s=>s.t==="Key Dates");
    if(!kdSub||!kdSub.c||!kdSub.c[0])return;
    const raw=kdSub.c[0];
    const entries=raw.split(" \u00b7 ");
    entries.forEach(e=>{
      const m=e.match(/^([^:]+):\s*(.+)$/);
      if(!m)return;
      const dateStr=m[1].trim();const desc=m[2].trim();
      const sortKey=parseDateSort(dateStr);
      events.push({dateStr,desc,regId:reg.id,regSt:reg.st,color:TL_COLORS[ri%TL_COLORS.length],sortKey});
    });
  });
  // Also add WC items
  WC.forEach(w=>{
    const reg=R.find(r=>r.id===w.reg);
    const ri=reg?R.indexOf(reg):0;
    const sortKey=parseDateSort(w.date);
    events.push({dateStr:w.date,desc:w.title,regId:w.reg,regSt:reg?reg.st:"General",color:reg?TL_COLORS[ri%TL_COLORS.length]:"#888",sortKey,isWC:true,wcStatus:w.status});
  });
  events.sort((a,b)=>a.sortKey-b.sortKey);
  return events;
}

function parseDateSort(s){
  const months={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  // "Apr 1, 2026" or "Jul 2010" or "2026" or "2025-2026" or "Early-Mid 2026" or "2028-2029"
  let m;
  if((m=s.match(/(\w+)\s+(\d+),\s*(\d{4})/)))return parseInt(m[3])*10000+months[m[1]]*100+parseInt(m[2]);
  if((m=s.match(/(\w{3})\s+(\d{4})/))&&months[m[1]])return parseInt(m[2])*10000+months[m[1]]*100;
  if((m=s.match(/(\d{4})\u2013(\d{4})/)))return parseInt(m[1])*10000+600;
  if((m=s.match(/Early.*(\d{4})/)))return parseInt(m[1])*10000+300;
  if((m=s.match(/(\d{4})/)))return parseInt(m[1])*10000+600;
  return 99999999;
}

function TimelineView({onNav}){
  const[filter,setFilter]=useState("all");
  const[era,setEra]=useState("all"); // all, past, future
  const allEvents=useMemo(()=>parseTimelineEvents(),[]);
  const regList=useMemo(()=>{
    const seen=new Set();const list=[];
    allEvents.forEach(e=>{if(e.regId&&!seen.has(e.regId)){seen.add(e.regId);list.push({id:e.regId,st:e.regSt,color:e.color})}});
    return list;
  },[allEvents]);

  const d=new Date();const now=d.getFullYear()*10000+(d.getMonth()+1)*100;
  const filtered=allEvents.filter(e=>{
    if(filter!=="all"&&e.regId!==filter)return false;
    if(era==="past"&&e.sortKey>=now)return false;
    if(era==="future"&&e.sortKey<now)return false;
    return true;
  });

  return(
  <div style={{maxWidth:720}} className="fade-up">
    <h2 style={{fontSize:"var(--text-xl)",fontWeight:700,marginBottom:4}}>Regulatory Timeline</h2>
    <p style={{color:"var(--text4)",fontSize:12,marginBottom:16}}>Key dates across all {R.length} regulations and pending changes. {allEvents.length} events total.</p>

    <div style={{marginBottom:12}}>
      <div className="tl-filter">
        {["all","past","future"].map(e=>
          <button key={e} className={"tl-chip"+(era===e?" active":"")} onClick={()=>setEra(e)}>
            {e==="all"?"All dates":e==="past"?"Historical":"Upcoming"}
          </button>)}
      </div>
      <div className="tl-filter" style={{marginTop:4}}>
        <button className={"tl-chip"+(filter==="all"?" active":"")} onClick={()=>setFilter("all")}>All regulations</button>
        {regList.map(r=>
          <button key={r.id} className={"tl-chip"+(filter===r.id?" active":"")} onClick={()=>setFilter(filter===r.id?"all":r.id)} style={filter===r.id?{}:{borderColor:r.color+"44"}}>
            <span style={{display:"inline-block",width:6,height:6,borderRadius:"50%",background:r.color,marginRight:4}}></span>{r.st}
          </button>)}
      </div>
    </div>

    <div aria-live="polite" style={{fontSize:"var(--text-sm)",color:"var(--text4)",marginBottom:8}}>{filtered.length} event{filtered.length!==1?"s":""} shown</div>

    <div className="tl-wrap">
      {filtered.map((e,i)=>
        <div key={i} className="tl-item">
          <div className="tl-dot" style={{background:e.color,boxShadow:"0 0 0 2px var(--bg), 0 0 0 3px "+(e.isWC?e.color+"88":"var(--border)")}}></div>
          <div className="tl-date">{e.dateStr}{e.isWC&&e.wcStatus&&<span style={{marginLeft:6,fontSize:"var(--text-xs)",padding:"0 4px",borderRadius:3,background:ST[e.wcStatus]?.bg||"transparent",color:ST[e.wcStatus]?.tx||"var(--text4)",border:"1px solid "+(ST[e.wcStatus]?.bd||"var(--border)")}}>{ST[e.wcStatus]?.lb||""}</span>}</div>
          <div className="tl-title">{e.desc}</div>
          {e.regId&&<span className="tl-reg" tabIndex={0} role="button" style={{borderLeft:"3px solid "+e.color}} onClick={()=>onNav&&onNav(e.regId)} onKeyDown={ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();onNav&&onNav(e.regId)}}}>{e.regSt}</span>}
        </div>
      )}
      {filtered.length===0&&<p style={{color:"var(--text5)",fontSize:"var(--text-md)",padding:"20px 0"}}>No events match the current filters.</p>}
    </div>
  </div>);
}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
        {[{id:"cap-adequacy",title:"RWA & Capital Ratios",desc:"Risk weights, CCFs, and a worked CET1 ratio"},{id:"lcr",title:"LCR",desc:"HQLA haircuts, outflow rates, trapped liquidity"},{id:"gsib",title:"G-SIB Surcharge",desc:"Method 1 vs. Method 2 scoring"},{id:"scb",title:"Stress Capital Buffer",desc:"DFAST-to-SCB pipeline and CET1 stack"}].map(c=>
          <button key={c.id} onClick={()=>onNav(c.id)} style={{padding:"12px 14px",borderRadius:8,border:"1px solid rgba(6,182,212,.15)",background:"rgba(6,182,212,.03)",textAlign:"left",transition:"border-color .15s,background .15s,color .15s"}}>
            <div style={{fontSize:"var(--text-sm)",fontWeight:700,color:"var(--text)",marginBottom:2}}>{c.title}</div>
            <div style={{fontSize:"var(--text-xs)",color:"var(--text4)",lineHeight:1.4}}>{c.desc}</div>
            <span style={{fontSize:"var(--text-xs)",fontWeight:700,color:"#22d3ee",marginTop:4,display:"inline-block"}}>{"\u{1F4D0}"} CALC</span>
          </button>
        )}

    </div>

    <div style={{marginTop:8,marginBottom:8}}>
      <h3 style={{fontSize:"var(--text-lg)",fontWeight:700,marginBottom:12}}>Quick Links</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
        {LINKS.map(lk=>
          <button key={lk.id} onClick={()=>lk.isView?window.location.hash="#/"+lk.id:onNav(lk.id)} style={{display:"flex",gap:12,alignItems:"center",padding:"14px 16px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg2)",textAlign:"left",transition:"border-color .15s,background .15s,color .15s"}}>
            <span style={{fontSize:22}}>{lk.icon}</span>
            <div>
              <div style={{fontSize:"var(--text-md)",fontWeight:700,color:"var(--text)"}}>{lk.title}</div>
              <div style={{fontSize:"var(--text-sm)",color:"var(--text4)"}}>  {lk.desc}</div>
            </div>
          </button>
        )}
      </div>
    </div>


  </div>);
}

/*═══════════════ ERROR BOUNDARY ═══════════════*/

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null}}
  static getDerivedStateFromError(error){return{hasError:true,error}}
  componentDidCatch(error,info){console.error("MyRegApp error:",error,info)}
  render(){
    if(this.state.hasError){
      return React.createElement("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",color:"var(--text)",fontFamily:"'DM Sans',system-ui,sans-serif"}},
        React.createElement("div",{style:{textAlign:"center",maxWidth:420,padding:40}},
          React.createElement("div",{style:{fontSize:48,marginBottom:16}},"\u26A0\uFE0F"),
          React.createElement("h1",{style:{fontSize:"var(--text-xl)",fontWeight:800,marginBottom:8}},"Something went wrong"),
          React.createElement("p",{style:{fontSize:"var(--text-md)",color:"var(--text3)",lineHeight:1.55,marginBottom:24}},"MyRegApp encountered an unexpected error. Your settings are preserved."),
          React.createElement("button",{onClick:()=>window.location.reload(),style:{padding:"10px 24px",borderRadius:8,background:"var(--amber)",color:"#000",fontSize:"var(--text-md)",fontWeight:700,border:"none",cursor:"pointer"}},"Reload App"),
          this.state.error&&React.createElement("details",{style:{marginTop:20,textAlign:"left",fontSize:"var(--text-sm)",color:"var(--text4)"}},
            React.createElement("summary",{style:{cursor:"pointer"}},"Technical details"),
            React.createElement("pre",{style:{marginTop:8,padding:12,background:"var(--bg3)",borderRadius:6,overflow:"auto",whiteSpace:"pre-wrap"}},this.state.error.toString())
          )
        )
      );
    }
    return this.props.children;
  }
}

function BottomTabBar({view,setView,onMoreTap}){
  const isMoreView=view==="glossary"||view==="explorer";
  const tabs=[
    {id:"regulations",icon:"📑",label:"Regs"},
    {id:"changing",icon:"🔔",label:"Changes"},
    {id:"timeline",icon:"⏳",label:"Timeline"},
    {id:"__more",icon:"•••",label:"More"},
  ];
  return(
  <div className="bottom-tab-bar" data-noprint>
    {tabs.map(tab=>{
      const isActive=tab.id==="__more"?isMoreView:(view===tab.id);
      return(
      <button key={tab.id} onClick={()=>tab.id==="__more"?onMoreTap():setView(tab.id)} aria-label={tab.label} aria-current={isActive?"page":undefined} className={isActive?"tab-active":"tab-inactive"}>
        <span className="tab-icon">{tab.icon}</span>
        <span className="tab-label">{tab.label}</span>
      </button>);
    })}
  </div>);
}

function MoreSheet({open,onClose,onNavigate,theme,toggleTheme,fontSize,setFontSize}){
  const prevFocus=useRef(null);
  const panelRef=useRef(null);
  useEffect(()=>{
    if(open){prevFocus.current=document.activeElement;document.body.style.overflow="hidden";setTimeout(()=>panelRef.current?.focus(),50)}
    else{document.body.style.overflow="";if(prevFocus.current){prevFocus.current.focus();prevFocus.current=null}}
    return()=>{document.body.style.overflow=""};
  },[open]);
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(e.key==="Escape")onClose()};
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[open,onClose]);
  const fSizes=[{id:"sm",l:"A⁻",al:"A⁻ Small font size"},{id:"md",l:"A",al:"A Medium font size"},{id:"lg",l:"A⁺",al:"A⁺ Large font size"}];
  const items=[
    {id:"glossary",icon:"📖",label:"Glossary",desc:Object.keys(G).length+" regulatory terms defined"},
    {id:"explorer",icon:"🧮",label:"Basel III Explorer",desc:"Interactive B3E impact analysis"},
  ];
  return(<>
    <div className={"more-sheet-overlay"+(open?" active":"")} onClick={onClose}/>
    <div ref={panelRef} className={"more-sheet-panel"+(open?" active":"")} role="dialog" aria-modal="true" aria-label="More options" tabIndex={-1}>
      <div style={{display:"flex",justifyContent:"center",padding:"10px 0 6px"}}>
        <div style={{width:36,height:4,borderRadius:2,background:"var(--border2)"}}/>
      </div>
      <div style={{padding:"8px 20px 16px"}}>
        <div style={{fontSize:"var(--text-xs)",fontWeight:700,color:"var(--text5)",textTransform:"uppercase",letterSpacing:".8px",marginBottom:12}}>More</div>
        {items.map(item=>(
          <button key={item.id} onClick={()=>{onNavigate(item.id);onClose()}} style={{display:"flex",alignItems:"center",gap:14,width:"100%",padding:"14px 0",borderBottom:"1px solid var(--border)",textAlign:"left",minHeight:44}}>
            <span style={{fontSize:22}}>{item.icon}</span>
            <div>
              <div style={{fontSize:"var(--text-md)",fontWeight:600,color:"var(--text)"}}>{item.label}</div>
              <div style={{fontSize:"var(--text-sm)",color:"var(--text4)"}}>{item.desc}</div>
            </div>
          </button>
        ))}
        <div style={{marginTop:16}}>
          <div style={{fontSize:"var(--text-xs)",fontWeight:700,color:"var(--text5)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Font Size</div>
          <div style={{display:"flex",gap:3,marginBottom:12}}>
            {fSizes.map(f=><button key={f.id} aria-label={f.al} onClick={()=>setFontSize(f.id)} style={{padding:"8px 10px",borderRadius:6,fontSize:"var(--text-sm)",fontWeight:700,background:fontSize===f.id?"var(--amber-bg3)":"var(--bg3)",color:fontSize===f.id?"var(--amber)":"var(--text4)",transition:"border-color .12s,background .12s,color .12s",flex:1,minHeight:44}}>{f.l}</button>)}
          </div>
          <div style={{fontSize:"var(--text-xs)",fontWeight:700,color:"var(--text5)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Theme</div>
          <button onClick={()=>{toggleTheme();onClose()}} style={{width:"100%",padding:"8px 10px",borderRadius:6,fontSize:"var(--text-sm)",fontWeight:600,background:"var(--bg3)",color:"var(--text3)",textAlign:"left",minHeight:44}}>
            {theme==="dark"?"☀️ Switch to Light":"🌙 Switch to Dark"}
          </button>
        </div>
      </div>
    </div>
  </>);
}

/*═══════════════ APP ═══════════════*/

function useIsMobile(){
  const[m,setM]=useState(window.innerWidth<768);
  useEffect(()=>{const h=()=>setM(window.innerWidth<768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h)},[]);
  return m;
}
function useIsTablet(){
  const[t,setT]=useState(window.innerWidth>=768&&window.innerWidth<1024);
  useEffect(()=>{const h=()=>setT(window.innerWidth>=768&&window.innerWidth<1024);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h)},[]);
  return t;
}

function App(){
  const{route,push:pushHash}=useHashRoute();
  const[view,setView]=useState(route.view==="start"?"regulations":(route.view||"regulations"));
  const[search,setSearch]=useState(route.q||"");
  const navTarget=useRef(null);
  const[navTick,setNavTick]=useState(0);
  const searchRef=useRef(null);
  const{theme,toggle:toggleTheme}=useTheme();
  const{sz:fontSize,setSz:setFontSize}=useFontSize();
  const isMob=useIsMobile();
  const navRef=useRef(null);
  const[moreOpen,setMoreOpen]=useState(false);
  const[navHeight,setNavHeight]=useState(isMob?48:88);
  useEffect(()=>{
    if(!navRef.current)return;
    const ro=new ResizeObserver(entries=>{for(const e of entries){const h=e.borderBoxSize?.[0]?.blockSize??e.target.getBoundingClientRect().height;if(h>0)setNavHeight(h)}});
    ro.observe(navRef.current);return()=>ro.disconnect();
  },[]);
  const debouncedSearch=useDebounce(search,200);

  // Persist search query in URL hash (debounced)
  const debouncedSearchForHash=useDebounce(search,300);
  useEffect(()=>{
    if(view!=="regulations")return;
    if(debouncedSearchForHash)pushHash("regulations",route.regId,route.subIdx,debouncedSearchForHash);
    else if(route.q)pushHash("regulations",route.regId,route.subIdx);
  },[debouncedSearchForHash,view]);

  // Sync view from hash changes (back/forward)
  useEffect(()=>{
    if(route.view&&route.view!==view){
      if(route.view==="start"){setView("regulations");pushHash("regulations")}
      else if(["regulations","explorer","changing","glossary","timeline"].includes(route.view))setView(route.view);
    }
  },[route.view]);

  const handleSetView=useCallback(v=>{
    setView(v);
    setMoreOpen(false);
    window.scrollTo(0,0);
    if(v!=="regulations")pushHash(v);
  },[pushHash]);

  const navToReg=useCallback(id=>{navTarget.current=id;setNavTick(t=>t+1);setView("regulations");setSearch("")},[]);

  // Global keyboard: / to focus search, Escape to blur
  useEffect(()=>{
    const handler=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable)return;
      if(e.key==="/"){e.preventDefault();searchRef.current?.focus()}
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[]);

  return(
  <div style={{minHeight:"100vh"}}>
    <a className="skip-link" href="#main-content">Skip to content</a>
    <NavBar view={view} setView={handleSetView} search={search} setSearch={setSearch} theme={theme} toggleTheme={toggleTheme} fontSize={fontSize} setFontSize={setFontSize} searchRef={searchRef} navRef={navRef}/>
    <main id="main-content" style={{paddingTop:navHeight+20,paddingBottom:isMob?100:40,paddingLeft:isMob?16:24,paddingRight:isMob?16:24,maxWidth:1120,margin:"0 auto"}}>
      {view==="regulations"&&<RegulationsView search={debouncedSearch} onNavigate={navTarget} navTick={navTick} hashRoute={route} pushHash={pushHash} navHeight={navHeight}/>}
      {view==="changing"&&<WhatsChangingView onNav={navToReg}/>}
      {view==="timeline"&&<TimelineView onNav={navToReg}/>}
      {view==="explorer"&&<BaselExplorer onNav={navToReg}/>}
      {view==="glossary"&&<GlossaryView search={debouncedSearch} onNav={navToReg}/>}
    </main>
    <footer data-noprint style={{textAlign:"center",padding:"20px 24px",borderTop:"1px solid var(--border)",color:"var(--text5)",fontSize:"var(--text-xs)"}}>
      MyRegApp v7.0.1 {"\u2014"} Site by <a href="mailto:jackarohan@gmail.com" style={{color:"var(--text3)",textDecoration:"underline",textUnderlineOffset:2}}>Jack Rohan</a> {"\u00b7"} Content current as of April 2026 {"\u00b7"} Not legal advice
    </footer>
    {isMob&&<BottomTabBar view={view} setView={handleSetView} onMoreTap={()=>setMoreOpen(true)}/>}
    {isMob&&<MoreSheet open={moreOpen} onClose={()=>setMoreOpen(false)} onNavigate={handleSetView} theme={theme} toggleTheme={toggleTheme} fontSize={fontSize} setFontSize={setFontSize}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
